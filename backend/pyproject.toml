[project]
name = "velox-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["B008", "S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
