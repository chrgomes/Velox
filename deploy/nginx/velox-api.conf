# /etc/nginx/sites-available/velox-api  (symlink into sites-enabled)
# TLS certificates are issued by certbot: sudo certbot --nginx -d api.example.com

limit_req_zone $binary_remote_addr zone=velox_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=velox_auth:10m rate=5r/s;

upstream velox_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location /api/v1/auth/ {
        limit_req zone=velox_auth burst=10 nodelay;
        include /etc/nginx/snippets/velox-proxy.conf;
    }

    location /api/ {
        limit_req zone=velox_api burst=40 nodelay;
        include /etc/nginx/snippets/velox-proxy.conf;
    }

    location / { return 404; }
}
